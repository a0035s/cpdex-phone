<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cpdex admin</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <div class="hero-top">
          <div>
            <h1 id="titleMain">cpdex Admin Console</h1>
            <p id="titleSub">Desktop startup panel for mobile connection and tunnel control</p>
          </div>
          <label class="lang-select">
            <span id="langLabel">Language</span>
            <select id="languageSelect">
              <option value="auto">Auto (System)</option>
              <option value="zh-CN">简体中文</option>
              <option value="zh-TW">繁體中文</option>
              <option value="en">English</option>
            </select>
          </label>
        </div>
      </header>

      <section class="card">
        <h2 id="backendTitle">Backend</h2>
        <p id="backendMeta" class="meta">Loading...</p>
        <div class="row">
          <button id="refreshBtn" class="btn">Refresh</button>
          <a id="openMobileLocal" class="btn primary" href="/mobile/" target="_blank" rel="noreferrer">Open Mobile UI (Local)</a>
        </div>
      </section>

      <section class="card">
        <h2 id="tokenTitle">Access Token</h2>
        <label class="field">
          <span id="tokenLabel">Bearer Token</span>
          <textarea id="tokenBox" rows="2" readonly></textarea>
        </label>
        <div class="row">
          <button id="copyTokenBtn" class="btn">Copy Token</button>
        </div>
      </section>

      <section class="card">
        <h2 id="tunnelTitle">Quick Tunnel</h2>
        <p id="tunnelMeta" class="meta">Tunnel stopped</p>
        <div class="row">
          <button id="startTunnelBtn" class="btn primary">Start Tunnel</button>
          <button id="stopTunnelBtn" class="btn danger">Stop Tunnel</button>
        </div>
        <label class="field">
          <span id="publicUrlLabel">Public URL</span>
          <input id="publicUrlBox" type="text" readonly />
        </label>
        <label class="field">
          <span id="mobileUrlLabel">Mobile URL (Auto Token)</span>
          <input id="publicMobileBox" type="text" readonly />
        </label>
        <div class="row">
          <button id="copyPublicBtn" class="btn">Copy Public URL</button>
          <button id="copyMobileBtn" class="btn">Copy Mobile URL</button>
          <a id="openMobilePublic" class="btn" href="#" target="_blank" rel="noreferrer">Open Public Mobile UI</a>
        </div>
      </section>

      <section class="card">
        <h2 id="logsTitle">Tunnel Logs</h2>
        <pre id="logBox" class="logs"></pre>
      </section>

      <p id="statusBar" class="status">Idle</p>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
